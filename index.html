<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bruce Team · Phủ Tam Quốc 3D</title>
<style>
:root {
  --gold: #e9c46a; --red: #7a1f1f; --ink: #1a1210; --paper: #f5ead2;
  --ok: #58c27d; --bad: #ef6a5b; --warn: #f2b84b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1326; color: var(--paper);
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

.panel { position: fixed; background: rgba(26, 18, 16, .82); border: 1px solid rgba(233, 196, 106, .55);
  border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0,0,0,.35); }
.panel h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold);
  border-bottom: 1px solid rgba(233,196,106,.3); padding-bottom: 6px; }
.hidden { display: none; }

#top { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
#top .title { font-size: 20px; font-weight: 700; letter-spacing: .14em; color: var(--gold); text-shadow: 0 2px 8px rgba(0,0,0,.6); margin-right: 6px; }
#top .title span { font-weight: 400; letter-spacing: .04em; color: var(--paper); }
.pill { padding: 4px 10px; border-radius: 999px; font-size: 12px; background: var(--red); border: 1px solid var(--gold); white-space: nowrap; }
.pill.soft { background: rgba(26,18,16,.75); border-color: rgba(233,196,106,.4); }
.pill.live { background: #1f5d3a; }
.pill.demo { background: #7a5a12; }
.pill.off { background: #5a2020; }
#clock { margin-left: auto; }

#left { top: 56px; left: 12px; width: 300px; max-height: calc(100% - 130px); overflow: auto; }
#right { top: 56px; right: 12px; width: 290px; max-height: 46%; overflow: auto; }
#card { right: 12px; bottom: 64px; width: 290px; }

.row { font-size: 12.5px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dashed rgba(245,234,210,.15); }
.row:last-child { border-bottom: 0; }
.row b { color: var(--gold); font-weight: 600; }
.row .sub { color: rgba(245,234,210,.75); font-size: 11.5px; display: block; overflow-wrap: anywhere; }
.row .n { color: var(--warn); }
.empty { font-size: 12.5px; color: rgba(245,234,210,.6); font-style: italic; }
.v-ok { color: var(--ok); } .v-bad { color: var(--bad); } .v-warn { color: var(--warn); }
.time { color: rgba(245,234,210,.55); font-variant-numeric: tabular-nums; margin-right: 4px; }

#card h3 { margin: 0; font-size: 17px; color: var(--gold); }
#card .job { font-size: 13px; margin-bottom: 6px; }
#card .kv { font-size: 12px; color: rgba(245,234,210,.8); margin: 2px 0; }
#card .close { position: absolute; top: 6px; right: 10px; cursor: pointer; color: var(--gold); font-size: 16px; }

#bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center;
  background: rgba(26,18,16,.82); border: 1px solid rgba(233,196,106,.55); border-radius: 999px; padding: 6px 10px; }
#bar button { font: inherit; font-size: 12.5px; color: var(--paper); background: transparent; border: 1px solid transparent;
  border-radius: 999px; padding: 5px 11px; cursor: pointer; }
#bar button:hover, #bar .link:hover { border-color: var(--gold); }
#bar .link { font-size: 12.5px; color: var(--gold); font-weight: 700; text-decoration: none; border: 1px solid transparent; border-radius: 999px; padding: 5px 11px; white-space: nowrap; }
#bar button.on { background: var(--red); border-color: var(--gold); }
#bar .sep { width: 1px; height: 18px; background: rgba(233,196,106,.4); margin: 0 4px; }
#hint { position: fixed; left: 50%; bottom: 58px; transform: translateX(-50%); font-size: 11.5px; color: rgba(245,234,210,.6);
  text-shadow: 0 1px 4px rgba(0,0,0,.7); pointer-events: none; white-space: nowrap; }

/* nhãn nổi trên đầu nhân vật */
.tag { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; will-change: transform, left, top; }
.tag .name { display: inline-block; font-size: 11.5px; line-height: 1.15; padding: 2px 7px 3px; border-radius: 6px;
  background: rgba(26,18,16,.72); border: 1px solid rgba(233,196,106,.45); }
.tag .name b { color: var(--gold); display: block; font-size: 12.5px; }
.tag.busy .name { background: var(--red); border-color: var(--gold); }
.tag.wait .name { background: #5d4a12; border-color: var(--gold); }
.tag .cnt { color: var(--warn); font-weight: 700; margin-left: 3px; }
.tag .say { display: none; margin: 0 auto 4px; max-width: 210px; white-space: normal; font-size: 11px; line-height: 1.3;
  color: var(--ink); background: var(--paper); border-radius: 8px; padding: 4px 8px; box-shadow: 0 2px 8px rgba(0,0,0,.35);
  overflow-wrap: anywhere; }
.tag.busy .say, .tag.wait .say { display: block; }
.tag .say i { color: #7a1f1f; font-style: normal; font-weight: 600; }

.float { position: absolute; transform: translate(-50%, -50%); font-weight: 800; font-size: 17px; letter-spacing: .06em;
  text-shadow: 0 2px 6px rgba(0,0,0,.8); animation: rise 2.6s ease-out forwards; white-space: nowrap; }
@keyframes rise { from { opacity: 0; margin-top: 0; } 12% { opacity: 1; } to { opacity: 0; margin-top: -90px; } }

@media (max-width: 900px) { #right, #hint { display: none; } #left { width: 240px; max-height: 38%; } }

/* điện thoại */
@media (max-width: 640px) {
  #top { flex-wrap: wrap; gap: 5px; top: 8px; left: 8px; right: 8px; }
  #top .title { font-size: 15px; width: 100%; }
  #top .title span { display: none; }
  #clock { display: none; }
  .pill { font-size: 11px; padding: 3px 8px; }
  #left { top: auto; bottom: 62px; left: 8px; right: 8px; width: auto; max-height: 24%; padding: 8px 10px; }
  #card { left: 8px; right: 8px; width: auto; bottom: 62px; z-index: 2; }
  #bar { left: 8px; right: 8px; transform: none; bottom: 8px; justify-content: space-between; gap: 2px; padding: 5px 6px; }
  #bar button, #bar .link { font-size: 10.5px; padding: 6px 4px; white-space: nowrap; }
  .tag .say { display: none !important; }   /* việc đang làm đã có trong bảng ở dưới */
  .tag:not(.busy):not(.wait) { visibility: hidden; }   /* chỉ hiện tên người đang làm; bấm vào nhân vật để xem ai */
  #bar .sep { display: none; }
  .tag .name { font-size: 9.5px; padding: 1px 5px 2px; }
  .tag .name b { font-size: 10.5px; }
  .tag .say { font-size: 9.5px; max-width: 140px; padding: 3px 6px; }
}
</style>

</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>

<header id="top">
  <div class="title">BRUCE TEAM <span>· Phủ Tam Quốc</span></div>
  <div id="mode" class="pill">…</div>
  <div id="counts" class="pill soft"></div>
  <div id="clock" class="pill soft"></div>
</header>

<aside id="left" class="panel">
  <h2>Đang làm việc</h2>
  <div id="active"></div>
</aside>

<aside id="right" class="panel">
  <h2>Sổ quân báo</h2>
  <div id="events"></div>
</aside>

<div id="card" class="panel hidden"></div>

<nav id="bar">
  <button data-view="all">Toàn cảnh</button>
  <button data-view="qa">QA Team</button>
  <button data-view="code">Bruce Team</button>
  <button data-view="train">Huấn luyện</button>
  <span class="sep"></span>
  <button id="btnDemo" title="Chạy một kịch bản mẫu để xem cả công ty hoạt động">Diễn tập</button>
  <button id="btnNight">Ngày / Đêm</button>
  <a class="link" href="https://brucedentalstudio.github.io/ips-lab-3d/">IPS Lab ↗</a>
</nav>
<div id="hint">Kéo chuột để xoay · cuộn để phóng to · bấm vào nhân vật để xem việc</div>
